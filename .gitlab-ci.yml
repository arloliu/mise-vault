# mise-vault CI: every catalog change is validated before it can merge.
# Runner requirements: private network access to Nexus AND the go proxy;
# docker or shell executor.
# CI/CD variables (Settings -> CI/CD -> Variables, masked):
#   NEXUS_CI_USER / NEXUS_CI_PASSWORD  — read-only Nexus account
#   GOPROXY_URL (optional)             — overrides config/defaults.json's
#     goproxy_url, same idea as NEXUS_URL below, for a CI network where the
#     go proxy lives under a different address than workstations use
#   NPM_REGISTRY_URL / PYPI_INDEX_URL / CARGO_INDEX_URL (optional) — the
#     registry endpoints the npm/pypi/cargo existence probes ask; CI job
#     images carry no npm or pip configuration to fall back on, so a
#     catalog with tools of those types needs these set (point them at
#     the same private proxies workstations use)

stages:
  - validate
  - verify
  - test

variables:
  NEXUS_CURL_OPTS: "-u $NEXUS_CI_USER:$NEXUS_CI_PASSWORD"
  # Override these (project/group CI variables) to pull through a private
  # registry, e.g. PYTHON_IMAGE=harbor.company.example/dockerhub-proxy/python:3.12
  PYTHON_IMAGE: "python:3.12"
  PYTHON_SLIM_IMAGE: "python:3.12-slim"
  # pip honors the standard PIP_INDEX_URL environment variable — set it as a
  # CI variable to install packages from an internal PyPI mirror.

# --- schema + catalog rule validation (no network needed) -------------------
validate-catalog:
  stage: validate
  image: $PYTHON_SLIM_IMAGE
  script:
    # the approve/add-version probe tests shell out to curl, which the
    # slim image does not ship; on a sealed runner with no public APT
    # mirrors, point PYTHON_SLIM_IMAGE at an internal image that already
    # ships curl — this fallback only runs when the image has none
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -qq -y curl)
    - pip install --quiet jsonschema        # formal schema engine in CI
    - scripts/validate-catalog
    # the validator must also provably REJECT unsafe catalog shapes
    - tests/run-validator-tests
    # approve pre-flight must also provably REJECT malformed or duplicate
    # batch specs before any write
    - tests/run-approve-tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- artifact existence in Nexus and the go proxy (cheap; every MR) ---------
# NEXUS_URL / GOPROXY_URL (CI variables) override the committed base URLs
# when the CI network reaches them under a different address than
# workstations use.
# This job only probes existence, never downloads a go module, so it needs
# no go toolchain.
verify-artifacts-exist:
  stage: verify
  image: $PYTHON_IMAGE                     # full image ships curl
  script:
    - scripts/verify-artifacts ${NEXUS_URL:+--nexus-url $NEXUS_URL} ${GOPROXY_URL:+--goproxy-url $GOPROXY_URL} ${NPM_REGISTRY_URL:+--npm-registry-url $NPM_REGISTRY_URL} ${PYPI_INDEX_URL:+--pypi-index-url $PYPI_INDEX_URL} ${CARGO_INDEX_URL:+--cargo-index-url $CARGO_INDEX_URL}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- full checksum verification (heavier; MRs touching catalog, and tags) ----
# A go toolchain is required here, and only here: with --checksum, every go
# tool version that carries an h1 gets verified with "go mod download",
# exactly like the plugin itself does at install time.
# --checksum also compares every hashed pypi record's full digest set
# against the simple index (curl only, no extra toolchain).
# A version without an h1 is a deliberate proxy-trust entry and is reported,
# not failed — see docs/development.md's go-installed tools section.
verify-artifacts-checksum:
  stage: verify
  image: $PYTHON_IMAGE                     # full image ships curl
  # On a sealed runner with no public APT mirrors, point PYTHON_IMAGE at an
  # internal image that already ships a go toolchain — the apt fallback below
  # only runs when the image has no go.
  before_script:
    - command -v go >/dev/null || (apt-get update -qq && apt-get install -qq -y golang-go)
  script:
    - scripts/verify-artifacts --checksum ${NEXUS_URL:+--nexus-url $NEXUS_URL} ${GOPROXY_URL:+--goproxy-url $GOPROXY_URL} ${NPM_REGISTRY_URL:+--npm-registry-url $NPM_REGISTRY_URL} ${PYPI_INDEX_URL:+--pypi-index-url $PYPI_INDEX_URL} ${CARGO_INDEX_URL:+--cargo-index-url $CARGO_INDEX_URL}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [ "catalog/**/*" ]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- real install + version discovery through the backend -------------------
# Image must provide: mise, git, curl, coreutils (company devtools base image).
install-test:
  stage: test
  image: $DEVTOOLS_CI_IMAGE
  script:
    # point the linked plugin at the CI-reachable Nexus / go proxy when
    # overridden, keeping every other committed default intact
    - if [ -n "${NEXUS_URL:-}" ] || [ -n "${GOPROXY_URL:-}" ]; then python3 -c "import json,os; p='config/defaults.json'; d=json.load(open(p)); d['nexus_url']=os.environ.get('NEXUS_URL') or d.get('nexus_url'); d['goproxy_url']=os.environ.get('GOPROXY_URL') or d.get('goproxy_url'); json.dump(d, open(p, 'w'), indent=2)"; fi
    # the plugin downloads with `curl -n`, so the job needs a netrc just like a
    # workstation does; host is taken from the effective Nexus URL
    - NEXUS_HOST=$(python3 -c "import json,urllib.parse;print(urllib.parse.urlparse(json.load(open('config/defaults.json'))['nexus_url']).hostname)")
    - printf 'machine %s\n  login %s\n  password %s\n' "$NEXUS_HOST" "$NEXUS_CI_USER" "$NEXUS_CI_PASSWORD" > ~/.netrc
    - chmod 600 ~/.netrc
    - mise plugins link vault "$CI_PROJECT_DIR"
    # discovery must equal the catalog exactly
    - mise ls-remote vault:golangci-lint | tee /tmp/lsr
    - python3 -c "import json;print('\n'.join(r['version'] for r in json.load(open('catalog/golangci-lint/versions.json'))))" > /tmp/expected
    - diff /tmp/expected /tmp/lsr
    # real install + execution of the newest approved version
    - VERSION=$(tail -1 /tmp/lsr)
    - mise install "vault:golangci-lint@$VERSION"
    - mise exec "vault:golangci-lint@$VERSION" -- golangci-lint version
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
