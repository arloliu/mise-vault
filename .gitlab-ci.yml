# mise-vault CI: every catalog change is validated before it can merge.
# Runner requirements: private network access to Nexus; docker or shell executor.
# CI/CD variables (Settings -> CI/CD -> Variables, masked):
#   NEXUS_CI_USER / NEXUS_CI_PASSWORD  — read-only Nexus account

stages:
  - validate
  - verify
  - test

variables:
  NEXUS_CURL_OPTS: "-u $NEXUS_CI_USER:$NEXUS_CI_PASSWORD"
  # Override these (project/group CI variables) to pull through a private
  # registry, e.g. PYTHON_IMAGE=harbor.company.example/dockerhub-proxy/python:3.12
  PYTHON_IMAGE: "python:3.12"
  PYTHON_SLIM_IMAGE: "python:3.12-slim"
  # pip honors the standard PIP_INDEX_URL environment variable — set it as a
  # CI variable to install packages from an internal PyPI mirror.

# --- schema + catalog rule validation (no network needed) -------------------
validate-catalog:
  stage: validate
  image: $PYTHON_SLIM_IMAGE
  script:
    - pip install --quiet jsonschema        # formal schema engine in CI
    - scripts/validate-catalog
    # the validator must also provably REJECT unsafe catalog shapes
    - tests/run-validator-tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- artifact existence in Nexus (cheap; every MR) --------------------------
# NEXUS_URL (CI variable) overrides the committed Nexus base URL when the CI
# network reaches Nexus under a different address than workstations do.
verify-artifacts-exist:
  stage: verify
  image: $PYTHON_IMAGE                     # full image ships curl
  script:
    - scripts/verify-artifacts ${NEXUS_URL:+--nexus-url $NEXUS_URL}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- full checksum verification (heavier; MRs touching catalog, and tags) ----
verify-artifacts-checksum:
  stage: verify
  image: $PYTHON_IMAGE                     # full image ships curl
  script:
    - scripts/verify-artifacts --checksum ${NEXUS_URL:+--nexus-url $NEXUS_URL}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [ "catalog/**/*" ]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- real install + version discovery through the backend -------------------
# Image must provide: mise, git, curl, coreutils (company devtools base image).
install-test:
  stage: test
  image: $DEVTOOLS_CI_IMAGE
  script:
    # point the linked plugin at the CI-reachable Nexus when overridden
    - if [ -n "${NEXUS_URL:-}" ]; then printf '{"nexus_url":"%s"}\n' "$NEXUS_URL" > config/defaults.json; fi
    # the plugin downloads with `curl -n`, so the job needs a netrc just like a
    # workstation does; host is taken from the effective Nexus URL
    - NEXUS_HOST=$(python3 -c "import json,urllib.parse;print(urllib.parse.urlparse(json.load(open('config/defaults.json'))['nexus_url']).hostname)")
    - printf 'machine %s\n  login %s\n  password %s\n' "$NEXUS_HOST" "$NEXUS_CI_USER" "$NEXUS_CI_PASSWORD" > ~/.netrc
    - chmod 600 ~/.netrc
    - mise plugins link vault "$CI_PROJECT_DIR"
    # discovery must equal the catalog exactly
    - mise ls-remote vault:golangci-lint | tee /tmp/lsr
    - python3 -c "import json;print('\n'.join(r['version'] for r in json.load(open('catalog/golangci-lint/versions.json'))))" > /tmp/expected
    - diff /tmp/expected /tmp/lsr
    # real install + execution of the newest approved version
    - VERSION=$(tail -1 /tmp/lsr)
    - mise install "vault:golangci-lint@$VERSION"
    - mise exec "vault:golangci-lint@$VERSION" -- golangci-lint version
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
