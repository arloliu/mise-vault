name: mise-vault-experiment

services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: mv-nexus
    ports:
      - "8081:8081"
    networks: [default, isolated]
    volumes:
      - nexus-data:/nexus-data
    environment:
      # keep the JVM modest; this is a single-user experiment instance
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=2g"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 60s

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: mv-gitlab
    hostname: gitlab.local
    ports:
      - "8929:8929"   # http (external_url below must match)
      - "2224:22"     # ssh (not needed for the PoC, but harmless)
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'Vq7#tKm2xRz9!pWd4s'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        prometheus_monitoring['enable'] = false
    shm_size: "256m"
    networks: [default, isolated]
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

  runner:
    image: gitlab/gitlab-runner:latest
    container_name: mv-runner
    networks: [default]
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-config:
  nexus-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:

networks:
  default:
  isolated:
    internal: true   # no outbound route: simulates the fully private network
